name: Android Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Check signing configuration and project
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -f package-lock.json || { echo 'Missing package-lock.json'; exit 1; }
          test -n "$ANDROID_KEYSTORE_BASE64" && test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD" || { echo 'Configure the four Android signing secrets. No release will be published.'; exit 1; }
      - run: npm ci
      - run: npm run typecheck --if-present
      - run: npm run lint --if-present
      - name: Run test suite
        run: npm run test:ci --if-present
      - name: Generate native project
        run: npx expo prebuild --platform android --non-interactive
      - name: Inject permanent release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          JAQNAIL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JAQNAIL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JAQNAIL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jaqnail.jks"
          echo "JAQNAIL_KEYSTORE_FILE=$RUNNER_TEMP/jaqnail.jks" >> "$GITHUB_ENV"
          python3 scripts/inject_release_signing.py android/app/build.gradle
      - name: Compile signed release APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon
      - name: Create named artifact and checksum
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          SRC="$(find android/app/build/outputs/apk/release -name '*.apk' -type f | head -n1)"
          test -s "$SRC"
          cp "$SRC" "dist/Jaqnail-v${VERSION}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - name: Publish GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/Jaqnail-*.apk
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true