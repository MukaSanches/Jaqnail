name: Android Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - name: Validate release gate and version
        run: python3 scripts/release_gate.py "$GITHUB_REF_NAME"
      - name: Check persistent signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Missing persistent signing configuration'; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      - run: python3 scripts/check_coverage.py
      - run: npm run prebuild
      - name: Configure permanent signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/jaqnail.jks"
          echo "JAQNAIL_KEYSTORE_FILE=$RUNNER_TEMP/jaqnail.jks" >> "$GITHUB_ENV"
          python3 scripts/inject_release_signing.py android/app/build.gradle
      - name: Build signed release
        env:
          JAQNAIL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JAQNAIL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JAQNAIL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon --max-workers=2
      - name: Check signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk | tee signature.txt
          if grep -q 'CN=Android Debug' signature.txt; then echo 'Debug certificate forbidden'; exit 1; fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: python3 scripts/android_smoke.py android/app/build/outputs/apk/release/app-release.apk
      - name: Name and checksum validated APK
        run: |
          mkdir -p dist/release
          cp android/app/build/outputs/apk/release/app-release.apk "dist/release/Jaqnail-${GITHUB_REF_NAME}.apk"
          (cd dist/release && sha256sum *.apk > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/release/Jaqnail-*.apk
            dist/release/SHA256SUMS.txt
          body_path: docs/RELEASE_REPORT.md
          fail_on_unmatched_files: true
      - name: Verify published download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/download-check"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/download-check"
          (cd "$RUNNER_TEMP/download-check" && sha256sum --check SHA256SUMS.txt)
      - name: Remove ephemeral key copy
        if: always()
        run: rm -f "$RUNNER_TEMP/jaqnail.jks"
