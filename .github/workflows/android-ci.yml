name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validation_draft:
        description: 'Attach test APK and smoke evidence to an unpublished validation draft'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      - run: python3 scripts/check_coverage.py
      - run: npm run prebuild
      - name: Configure signing when all owner secrets are available
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 scripts/configure_ci_signing.py
      - name: Build standalone Android APK
        id: build
        env:
          JAQNAIL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          JAQNAIL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          JAQNAIL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon --max-workers=2
      - name: Verify certificate and record provenance
        run: |
          mkdir -p dist
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk > dist/signature.txt
          if [ "$PERSISTENT_SIGNING" = true ] && grep -q 'CN=Android Debug' dist/signature.txt; then exit 1; fi
          python3 scripts/release_gate.py --digest > dist/product-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Jaqnail-TEST-APK-NOT-FOR-DISTRIBUTION
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android installation and launch smoke
        id: smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: python3 scripts/android_smoke.py android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-smoke-evidence
          path: dist/smoke/
          if-no-files-found: warn
      - name: Prepare unpublished validation draft
        if: always() && github.ref == 'refs/heads/main' && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          tag="validation-${GITHUB_SHA:0:12}"
          cp android/app/build/outputs/apk/release/app-release.apk dist/Jaqnail-validation.apk
          (cd dist && sha256sum Jaqnail-validation.apk > SHA256SUMS.txt)
          tar -czf dist/android-smoke-evidence.tar.gz -C dist smoke
          python3 - <<'PYCODE'
          import os,json,pathlib
          manifest={'commit':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'persistent_signing':os.environ['PERSISTENT_SIGNING']=='true','android_smoke':os.environ['SMOKE_OUTCOME'],'product_sha256':pathlib.Path('dist/product-sha256.txt').read_text().strip()}
          pathlib.Path('dist/manifest.json').write_text(json.dumps(manifest,indent=2))
          PYCODE
          gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" --title "Validação Android ${GITHUB_SHA:0:12}" --notes-file dist/manifest.json dist/Jaqnail-validation.apk dist/SHA256SUMS.txt dist/signature.txt dist/manifest.json dist/android-smoke-evidence.tar.gz
      - name: Remove private signing copy
        if: always()
        run: rm -f "$RUNNER_TEMP/jaqnail-release.p12"
