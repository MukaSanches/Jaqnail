name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      validation_draft:
        description: 'Attach test APK and smoke evidence to an unpublished validation draft'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:ci
      - run: python3 scripts/check_coverage.py
      - run: npm run prebuild
      - name: Build standalone TEST APK (debug key, not distribution)
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: Jaqnail-TEST-APK-NOT-FOR-DISTRIBUTION
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android installation and launch smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: python3 scripts/android_smoke.py android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-smoke-evidence
          path: dist/smoke/
          if-no-files-found: warn
      - name: Prepare unpublished validation draft
        if: success() && github.event_name == 'workflow_dispatch' && inputs.validation_draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="validation-${GITHUB_SHA:0:12}"
          cp android/app/build/outputs/apk/release/app-release.apk dist/Jaqnail-TEST-NOT-FOR-DISTRIBUTION.apk
          (cd dist && sha256sum Jaqnail-TEST-NOT-FOR-DISTRIBUTION.apk > SHA256SUMS.txt)
          tar -czf dist/android-smoke-evidence.tar.gz -C dist smoke
          printf '%s\n' 'Artefato interno de validação. Assinatura de teste; não distribuir. Este rascunho não é a versão v1.0.0.' > dist/validation-notes.md
          gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" --title "Validação Android ${GITHUB_SHA:0:12}" --notes-file dist/validation-notes.md dist/Jaqnail-TEST-NOT-FOR-DISTRIBUTION.apk dist/SHA256SUMS.txt dist/android-smoke-evidence.tar.gz
